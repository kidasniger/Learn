name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The app's debug signingConfig points to ${rootDir}/debug.keystore.
      # Generate a CI-only debug keystore because this file is intentionally not committed.
      - name: Generate debug signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build and test APK
        run: gradle assembleDebug testDebugUnitTest --no-daemon

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: learn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: learn-debug-apk
          path: dist

      - name: Verify release APK
        run: test -s dist/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Learn v1.2.0
          body: |
            Learn v1.2.0

            - Modèles Tiny Q8, Base Q5 et Small Q5 adaptés aux téléphones.
            - Limite d'enregistrement de 2 minutes par session.
            - Erreurs de transcription explicites et durée de traitement affichée.
            - Mise à jour de whisper.cpp vers v1.9.5.
            - Compilation avec Android API 36 et NDK compatible avec les pages mémoire de 16 Ko.
          files: dist/app-debug.apk
          fail_on_unmatched_files: true
