name: Learn Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile and run unit tests
        run: gradle assembleDebug testDebugUnitTest lintDebug --no-daemon

      - name: Verify debug APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: learn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Android emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Launch app in Android emulator and run instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon

  release:
    name: Signed production release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:') && vars.LEARN_RELEASE_READY == 'true' }}
    needs: [build, instrumentation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate signing inputs
        shell: bash
        env:
          LEARN_KEYSTORE_BASE64: ${{ secrets.LEARN_KEYSTORE_BASE64 }}
          LEARN_KEYSTORE_PASSWORD: ${{ secrets.LEARN_KEYSTORE_PASSWORD }}
          LEARN_KEY_ALIAS: ${{ secrets.LEARN_KEY_ALIAS }}
          LEARN_KEY_PASSWORD: ${{ secrets.LEARN_KEY_PASSWORD }}
        run: |
          test -n "$LEARN_KEYSTORE_BASE64"
          test -n "$LEARN_KEYSTORE_PASSWORD"
          test -n "$LEARN_KEY_ALIAS"
          test -n "$LEARN_KEY_PASSWORD"
          echo "$LEARN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/learn-release.jks"
          test -s "$RUNNER_TEMP/learn-release.jks"
          echo "LEARN_KEYSTORE_PATH=$RUNNER_TEMP/learn-release.jks" >> "$GITHUB_ENV"

      - name: Build signed production APK
        env:
          LEARN_KEYSTORE_PASSWORD: ${{ secrets.LEARN_KEYSTORE_PASSWORD }}
          LEARN_KEY_ALIAS: ${{ secrets.LEARN_KEY_ALIAS }}
          LEARN_KEY_PASSWORD: ${{ secrets.LEARN_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify production APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish signed GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Learn v${{ steps.version.outputs.value }}
          body: |
            Learn ${{ steps.version.outputs.value }} — version de production signée.

            - Gestion de plusieurs modèles locaux et choix du moteur chargé.
            - Import audio par blocs, transcription progressive et horodatage.
            - Édition, recherche, dossiers, favoris et export TXT/PDF/SRT/VTT.
            - CI : compilation, tests unitaires et test de lancement sur émulateur.
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
