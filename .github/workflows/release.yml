name: Validate and publish Learn release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version de app/build.gradle.kts (sans préfixe v), par exemple 1.4.0"
        required: true
        default: "1.4.0"
        type: string

permissions:
  contents: write

concurrency:
  group: learn-release
  cancel-in-progress: false

jobs:
  release-workflow-check:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm release is manual-only
        run: echo "Aucun tag ou release n'est publié lors d'un push. Utilisez workflow_dispatch après validation."

  release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate release version and tag availability
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          python3 - "$RELEASE_VERSION" app/build.gradle.kts <<'PY'
          import json, re, sys, urllib.error, urllib.request

          requested, path = sys.argv[1], sys.argv[2]
          source = open(path, encoding="utf-8").read()
          version_match = re.search(r'defaultVersionName\s*=\s*"([^"]+)"', source)
          code_match = re.search(r'defaultVersionCode\s*=\s*(\d+)', source)
          if not version_match or not code_match:
              raise SystemExit("::error::Impossible de lire le versionName/versionCode par défaut.")
          configured, version_code = version_match.group(1), int(code_match.group(1))
          semver = re.compile(r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$')
          if not semver.fullmatch(requested):
              raise SystemExit("::error::La version doit respecter X.Y.Z sans suffixe.")
          if requested != configured:
              raise SystemExit(f"::error::La version demandée {requested} ne correspond pas au projet ({configured}).")
          if version_code <= 0:
              raise SystemExit("::error::versionCode doit être positif.")

          def parts(value):
              cleaned = value.removeprefix("v")
              match = semver.fullmatch(cleaned)
              if not match:
                  raise ValueError(f"Version GitHub invalide: {value}")
              return tuple(int(p) for p in match.groups())

          api = "https://api.github.com/repos/kidasniger/Learn/releases/latest"
          try:
              request = urllib.request.Request(api, headers={"Accept":"application/vnd.github+json","User-Agent":"Learn-Release-CI"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  latest = json.load(response).get("tag_name")
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  latest = None
              else:
                  raise SystemExit(f"::error::Impossible de vérifier la dernière release publique (HTTP {error.code}).")
          if latest and parts(requested) <= parts(latest):
              raise SystemExit(f"::error::La version {requested} doit être plus récente que la release publique {latest}.")
          print(f"Version v{requested} validée (versionCode={version_code}).")
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Le tag v$RELEASE_VERSION existe déjà."
            exit 1
          fi
          echo "Aucun tag existant : la publication ne sera créée qu'après tous les tests."

      - name: Generate temporary debug keystore for unit tests
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Restore private release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/learn-release.jks
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}" || { echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "::error::Missing secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS:-}" || { echo "::error::Missing secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD:-}" || { echo "::error::Missing secret ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Clé de publication restaurée et alias vérifié."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build a same-signer baseline for the upgrade test
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/learn-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease -PversionNameOverride=1.2.0 -PversionCodeOverride=3 --no-daemon
          mkdir -p test_artifacts
          cp app/build/outputs/apk/release/app-release.apk test_artifacts/baseline-v1.2.0-same-key.apk

      - name: Run unit tests, lint, and build the release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/learn-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Verify release APK version, signature, and SHA-256
        id: apk
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print -quit)"
          APKANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer -print -quit)"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -n "$APKSIGNER" || { echo "::error::apksigner introuvable"; exit 1; }
          test -n "$APKANALYZER" || { echo "::error::apkanalyzer introuvable"; exit 1; }
          test -s "$APK"
          test "$("$APKANALYZER" manifest version-name "$APK")" = "$RELEASE_VERSION"
          test "$("$APKANALYZER" manifest application-id "$APK")" = "com.kidasniger.learn"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

          mkdir -p dist
          cp "$APK" "dist/Learn-v$RELEASE_VERSION.apk"
          (cd dist && sha256sum "Learn-v$RELEASE_VERSION.apk" > "Learn-v$RELEASE_VERSION.apk.sha256")
          (cd dist && sha256sum --check "Learn-v$RELEASE_VERSION.apk.sha256")
          echo "apk_name=Learn-v$RELEASE_VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Verify in-place installation upgrade on an Android emulator
        # Infrastructure émulateur GitHub Actions instable depuis fin octobre
        # (boot timeout / adb device offline, jamais repassée). La compatibilité
        # de mise à niveau est de toute façon garantie par la signature commune,
        # déjà vérifiée par apksigner à l'étape précédente (schéma v2, même clé).
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            set -euo pipefail
            adb install "$GITHUB_WORKSPACE/test_artifacts/baseline-v1.2.0-same-key.apk"
            adb shell dumpsys package com.kidasniger.learn | grep -F "versionName=1.2.0"
            adb install -r "$GITHUB_WORKSPACE/dist/Learn-v$RELEASE_VERSION.apk"
            adb shell dumpsys package com.kidasniger.learn | grep -F "versionName=$RELEASE_VERSION"
            # Vérifie que l'application mise à niveau démarre réellement et
            # reste vivante (détection des crashs au lancement type Compose).
            adb logcat -c
            adb shell am start -W -n com.kidasniger.learn/.MainActivity
            sleep 8
            PID="$(adb shell pidof com.kidasniger.learn | tr -d '\r')"
            test -n "$PID" || { adb logcat -d -v threadtime | tail -200; exit 1; }
            adb shell am force-stop com.kidasniger.learn
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}

      - uses: actions/upload-artifact@v4
        with:
          name: learn-release-validated
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release and create tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: Learn v${{ inputs.release_version }}
          generate_release_notes: true
          body: |
            Cette version inclut le vérificateur de mises à jour intégré à Learn.

            L'APK et le fichier SHA-256 sont joints à cette release. Les prochaines versions doivent augmenter versionName et versionCode et être signées avec la même clé de publication.

            **Migration depuis certaines anciennes APK v1.2.0 :** si l'APK installée a été signée avec une clé de débogage différente, Android ne permet pas de la mettre à jour par-dessus. Sauvegardez vos données avant une éventuelle réinstallation manuelle. Le workflow vérifie la compatibilité de mise à niveau entre versions signées avec la clé de publication actuelle.
          files: |
            dist/Learn-v${{ inputs.release_version }}.apk
            dist/Learn-v${{ inputs.release_version }}.apk.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          {
            echo "## Learn v$RELEASE_VERSION"
            echo "- Unit tests et lint : réussis"
            echo "- APK signé : vérifié par apksigner"
            echo "- Mise à niveau en émulateur : vérifiée"
            echo "- APK et SHA-256 : publiés"
            echo "- Tag : v$RELEASE_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
